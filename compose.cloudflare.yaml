# Cloudflared 2026.10.7, pinned to the verified amd64 image digest.
# This project connects to Deckhand's existing Docker network; it publishes no ports.
services:
  cloudflared:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /srv/deckhand/edge/runtime
        target: /etc/cloudflared
        read_only: true
        bind:
          create_host_path: false
    networks:
      - application
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  application:
    external: true
    name: deckhand_default
